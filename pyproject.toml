[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prompt-privacy-enhancement"
version = "0.1.0.dev3"
description = "Testable privacy harness for LLM prompts: detect, swap with surrogates, restore, sealed audit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/prompt_privacy/detectors/gitleaks_rules/LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Keith Nielsen" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=50",   # HPKE with ML-KEM-768 + X25519 hybrid, AES-GCM, HMAC
    "argon2-cffi>=25.1",  # dev token stand-in derivation (ADR-0010)
    "pyyaml>=6",
    "jsonschema>=4.23",
    "google-re2>=1.1.20251105",  # RE2 for the imported Gitleaks rules: Go regex syntax, linear time
]

[project.optional-dependencies]
serve = ["aiohttp>=3.14.5"]  # phase 2a proxy; compiled parser required at start-up
bench = ["pyarrow>=26"]  # `ppe evaluate`: reads pinned parquet datasets
dev = [
    "aiohttp>=3.14.5", "pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-jsonschema",
    "pyarrow>=26",
    "python-stdnum>=2.2",  # test-only independent check-digit reference (LGPL-2.1+); never imported by PPE
]

[project.scripts]
ppe = "prompt_privacy.cli.main:main"

[tool.hatch.build.targets.sdist]
# Bench outputs are evidence for the repo, not sources for a build (review F-14).
exclude = ["/bench/results", "/bench/review-*/results", "/docs/private"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_privacy"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "prompt_privacy/_schemas"
"policies" = "prompt_privacy/_policies"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # synthetic fake secrets in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
